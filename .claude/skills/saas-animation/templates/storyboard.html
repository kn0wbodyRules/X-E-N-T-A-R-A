<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Storyboard</title>
<style>
  /* Use the brand's own font for the whole board. */
  @font-face { font-family: Brand; src: url("fonts/Poppins-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: Brand; src: url("fonts/Poppins-SemiBold.ttf"); font-weight: 600 700; }
  * { box-sizing: border-box; } html, body { margin: 0; background: #0B0B10; color: #f2f2f4; font-family: Brand, system-ui, sans-serif; }
  .board { width: 1920px; padding: 40px 30px; } h1 { margin: 0 0 6px; font-size: 42px; font-weight: 600; letter-spacing: -1.2px; } h1 span { color: #8a8a94; font-weight: 400; }
  .sub { font-size: 18px; color: #b9b9c1; margin-bottom: 26px; max-width: 1700px; line-height: 1.45; }
  .grid { display: grid; grid-template-columns: repeat(4, 450px); gap: 30px 26px; }
  .frame { position: relative; width: 450px; height: 253px; border-radius: 10px; overflow: hidden; background: #111; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .num { position: absolute; left: 12px; top: 10px; width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #000; font-weight: 700; font-size: 22px; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .hl { position: absolute; left: 0; right: 0; top: 16px; text-align: center; font-weight: 600; font-size: 24px; letter-spacing: -0.8px; }
  .t { font-size: 13px; color: #7d7d87; margin-top: 10px; } .b { font-size: 19px; font-weight: 600; margin: 2px 0 4px; }
  .vo { margin-top: 6px; font-size: 14.5px; color: #8BA5FD; } .d { font-size: 14.5px; color: #b9b9c1; line-height: 1.45; }
  .mv { margin-top: 7px; font-size: 13.5px; color: #F5D04E; line-height: 1.4; } .tr { margin-top: 7px; font-size: 13.5px; color: #1FE39A; line-height: 1.4; }
</style></head><body>
<div class="board"><h1>Brand <span>· ad · storyboard</span></h1>
  <div class="sub">What the ad is, its length, and the rules it follows. Blue = voiceover, yellow = what moves, green = how this shot becomes the next.</div>
  <div class="grid" id="g"></div></div>
<script>
// [time, frame image (or ''), field colour, headline on the frame, title, VO line, description, motion, transition]
const S = [
  ['0.0–2.0s', 'frames/1.jpg', '#30E2A8', 'Headline.', 'Shot title', '“Voiceover line.”', 'What we see.', 'What moves and how.', 'How it becomes shot 2.'],
];
document.getElementById('g').innerHTML = S.map(([t, img, bg, hl, b, vo, d, mv, tr], i) => `<div><div class="frame" style="background:${bg}"><div class="num">${i + 1}</div>${img ? `<img src="${img}">` : ''}${hl ? `<div class="hl">${hl}</div>` : ''}</div>
  <div class="t">${t}</div><div class="b">${b}</div>${vo ? `<div class="vo">${vo}</div>` : ''}<div class="d">${d}</div>${mv ? `<div class="mv">${mv}</div>` : ''}<div class="tr">→ ${tr}</div></div>`).join('');
</script></body></html>
