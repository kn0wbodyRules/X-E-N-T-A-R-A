<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ad (2D)</title>
<style>
  /* Put the brand's font files next to the page and point these at them (Poppins shown as an example). */
  @font-face { font-family: Head; src: url("fonts/Poppins-SemiBold.ttf"); }
  html,body{margin:0;background:#000;height:100%} body{display:flex;align-items:center;justify-content:center} canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:block}
</style></head><body><canvas id="c"></canvas>
<script src="puppet.js"></script>
<script>
// 2D flat-illustration ad starter: shots on flat brand fields, each shot change a growing circle/square cut from the
// outgoing shot (flooded with the next field colour, then the next shot eases in), word-by-word swipe-up headlines,
// optional posterised time, line boil and sticker shadows. Copy, rename, fill SHOTS. Page contract: renderAt(t), TOTAL, ready.
const W = 1920, H = 1080, END = 8, POST = 12, q = new URLSearchParams(location.search), SCALE = parseFloat(q.get('scale') || '1');   // POST: poses per second (0 = smooth)
const cv = document.getElementById('c'); cv.width = W * SCALE; cv.height = H * SCALE; const ctx = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; return c; };
const clamp01 = v => Math.max(0, Math.min(1, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp01((t - a) / (b - a));
const outCubic = k => 1 - Math.pow(1 - clamp01(k), 3), inOutCubic = k => { k = clamp01(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const backOut = (k, s = 1.7) => { k = clamp01(k); return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const TAU = Math.PI * 2, INK = '#111';
let POSE = 0, BID = 0; const rnd = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const boil = (amt = 1.4) => { const id = BID++; return [(rnd(POSE, id) - 0.5) * 2 * amt, (rnd(POSE, id + 57) - 0.5) * 2 * amt]; };   // per-pose jitter: hand-drawn feel
function sticker(c, on = true) { c.shadowColor = on ? 'rgba(17,17,17,0.26)' : 'transparent'; c.shadowOffsetX = 16 * SCALE; c.shadowOffsetY = 18 * SCALE; c.shadowBlur = 0; }
function field(c, col, lt = 0) {   // flat field + a faint drifting grid (3.5px lines: thinner ones vanish when the shot is scaled) + a soft bottom glow
  c.fillStyle = col; c.fillRect(0, 0, W, H); if (col === '#000') return;
  c.save(); c.strokeStyle = 'rgba(255,255,255,0.11)'; c.lineWidth = 3.5; const g = 120, o = Math.round((lt * 24) % g); c.beginPath();
  for (let x = -g + o; x < W + g; x += g) { c.moveTo(x, 0); c.lineTo(x, H); } for (let y = -g + o * 0.5; y < H + g; y += g) { c.moveTo(0, y); c.lineTo(W, y); } c.stroke();
  const bg = c.createRadialGradient(W / 2, H * 1.08, 0, W / 2, H * 1.08, 950); bg.addColorStop(0, 'rgba(255,255,255,0.24)'); bg.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = bg; c.fillRect(0, 0, W, H); c.restore();
}
function swipeWords(c, str, lt, t0 = 0.2, { y = 166, size = 76, col = INK, stagger = 0.09, dur = 0.32 } = {}) {   // each word slides up from behind a mask
  c.save(); c.font = `600 ${size}px Head, system-ui, sans-serif`; c.letterSpacing = (-size * 0.03) + 'px'; const words = str.split(' '), sp = c.measureText(' ').width, ws = words.map(w => c.measureText(w).width);
  let x = W / 2 - (ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1)) / 2;
  words.forEach((w, i) => { const e = outCubic(prog(lt, t0 + i * stagger, t0 + i * stagger + dur)); if (e > 0) { c.save(); c.beginPath(); c.rect(x - 12, y - size * 1.05, ws[i] + 24, size * 1.42); c.clip(); c.fillStyle = col; c.fillText(w, x, y + (1 - e) * size * 1.3); c.restore(); } x += ws[i] + sp; });
  c.restore();
}
// ---- shots: START times, TR transition windows (shot k -> k+1). out: the shape in shot k that grows into shot k+1 (frame px) ----
const START = [0, 2.5, 5.0], TR = [[2.5, 3.0], [5.0, 5.5]];
const SHOTS = [
  { bg: '#30E2A8', draw(c, lt) { field(c, this.bg, lt); swipeWords(c, 'Your first headline.', lt);
      const [bx, by] = boil(); sticker(c); c.beginPath(); c.roundRect(760 + bx, 400 + by, 400, 300, 28); c.fillStyle = '#fff'; c.fill(); sticker(c, false); c.lineWidth = 6; c.strokeStyle = INK; c.stroke(); },
    out: { kind: 'rect', rect: [760, 400, 1160, 700], r: 28 } },
  { bg: '#F5D04E', draw(c, lt) { field(c, this.bg, lt); swipeWords(c, 'Second beat.', lt);
      const k = backOut(prog(lt, 0.3, 0.6)); c.beginPath(); c.arc(960, 560, Math.max(0, 140 * k), 0, TAU); c.fillStyle = '#26BAFD'; c.fill(); c.lineWidth = 6; c.strokeStyle = INK; c.stroke(); },
    out: { kind: 'circle', c: [960, 560], r: 140 } },
  { bg: '#000', draw(c, lt) { field(c, this.bg); swipeWords(c, 'Brand. Tagline.', lt, 0.3, { y: 560, size: 90, col: '#fff' }); } },
];
const SH = SHOTS.map(mk);
const zoomOf = (k, lt) => 1 + (k === SHOTS.length - 1 ? 0.02 : 0.045) * lt, panOf = (k, lt) => k === SHOTS.length - 1 ? 0 : -16 * lt;   // slow push + rightward drift; end card stays centred
function drawShot(k, lt) { BID = k * 1000; const c = SH[k].getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.setTransform(SCALE, 0, 0, SCALE, 0, 0); SHOTS[k].draw(c, lt); return SH[k]; }
function blit(c, can, z, px) { c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.translate(cv.width / 2 + px * SCALE, cv.height / 2); c.scale(z, z); c.drawImage(can, -cv.width / 2, -cv.height / 2); c.restore(); }
const toScreen = (k, lt, x, y) => [W / 2 + panOf(k, lt) + (x - W / 2) * zoomOf(k, lt), H / 2 + (y - H / 2) * zoomOf(k, lt), zoomOf(k, lt)];
function render(t) {
  const tp = POST ? Math.floor(t * POST + 1e-6) / POST : t; POSE = Math.round(tp * (POST || 60));
  let k = 0; for (let i = 0; i < START.length; i++) if (tp >= START[i]) k = i;
  const inTr = k > 0 && tp < TR[k - 1][1], cur = inTr ? k - 1 : k, lt = tp - START[cur];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height); blit(ctx, drawShot(cur, lt), zoomOf(cur, lt), panOf(cur, lt));
  if (inTr) { const nx = cur + 1, ln = tp - START[nx], e = inOutCubic(prog(tp, TR[cur][0], TR[cur][1])), o = SHOTS[cur].out, can = drawShot(nx, ln);
    ctx.save(); ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.beginPath();
    if (o.kind === 'circle') { const [x, y, s] = toScreen(cur, lt, ...o.c); ctx.arc(lerp(x, W / 2, e), lerp(y, H / 2, e), lerp(o.r * s, Math.hypot(W, H) * 0.62, e), 0, TAU); }
    else { const [x0, y0] = toScreen(cur, lt, o.rect[0], o.rect[1]), [x1, y1, s] = toScreen(cur, lt, o.rect[2], o.rect[3]); ctx.roundRect(lerp(x0, -30, e), lerp(y0, -30, e), lerp(x1 - x0, W + 60, e), lerp(y1 - y0, H + 60, e), lerp(o.r * s, 0, e)); }
    ctx.save(); ctx.clip(); ctx.fillStyle = SHOTS[nx].bg; ctx.fillRect(0, 0, W, H); if (e > 0.12) blit(ctx, can, zoomOf(nx, ln) * lerp(0.93, 1, prog(e, 0.12, 1)), panOf(nx, ln)); ctx.restore();
    ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.globalAlpha = 1 - e; ctx.stroke(); ctx.restore(); }
}
window.TOTAL = END; window.renderAt = t => render(t);
window.ready = document.fonts.load('600 76px Head, sans-serif').catch(() => {}).then(() => { if (q.has('t')) render(parseFloat(q.get('t'))); else (function tick(n) { render((n / 1000) % END); requestAnimationFrame(tick); })(0); return true; });
</script></body></html>
